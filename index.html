<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT 下载</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f5f5f7;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    color: #1d1d1f;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 40px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    text-align: center;
    max-width: 360px;
    width: 90%;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p  { font-size: 14px; color: #6e6e73; margin: 4px 0; }
  .btn {
    margin-top: 20px;
    display: inline-block;
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-size: 15px;
    border-radius: 999px;
    cursor: pointer;
  }
  .btn:hover { background: #0077ed; }
  .hint { font-size: 12px; color: #86868b; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>PPT 下载</h1>
    <p>文件应为自动开始下载，如未开始请点击下方按钮喵。</p>
    <a class="btn" id="dl" href="myh.pptx" download>重新下载 PPT</a>
    <p class="hint">下载的是 myh.pptx</p>
  </div>

  <script>
    // 页面加载完成后自动触发一次下载
    window.addEventListener("load", () => {
      document.getElementById("dl").click();
    });
  </script>
</body>
</html>
